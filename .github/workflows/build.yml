# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    name: "${{ matrix.name }}"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            build_dir: build/clang-release
          - name: macOS ARM64
            os: macos-14
            build_dir: build/clang-release

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history + tags so the version is derived correctly

    # ── Compiler installation (platform-specific) ──

    - name: Install clang (Linux)
      if: runner.os == 'Linux'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${{ env.LLVM_VERSION }}

    - name: Install Homebrew dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm ninja
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

    # ── Common setup ──

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ matrix.os }}
        max-size: 256M

    - name: Install CMake
      uses: ssrobins/install-cmake@v1

    - name: Install Ninja (Linux)
      if: runner.os == 'Linux'
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: "Get library crispy & vtparser"
      run: python3 scripts/get_contour_dirs.py

    # ── Configure ──

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake --preset clang-release -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }} -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }}

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: cmake --preset clang-release

    # ── Build & Test ──

    - name: Build
      run: cmake --build ${{ matrix.build_dir }}

    - name: Check endo formatting
      if: runner.os == 'Linux'
      run: |
        find . -name '*.endo' -not -path './tmp/*' -not -path './build/*' \
          | xargs ${{ matrix.build_dir }}/src/shell/endo format --check
      timeout-minutes: 2

    - name: Test
      working-directory: ${{ matrix.build_dir }}
      run: ctest --output-on-failure
      timeout-minutes: 5

    # ── macOS packaging ──

    - name: Build DMG installer
      if: runner.os == 'macOS'
      working-directory: ${{ matrix.build_dir }}
      run: cpack -G DragNDrop

    - name: Upload DMG installer
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: endo-macos-arm64-dmg
        path: ${{ matrix.build_dir }}/endo-*.dmg
        retention-days: 30

  static-build:
    runs-on: ubuntu-latest
    name: "Linux static x86_64"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history + tags so the version is derived correctly

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libc6-dev ninja-build

    - name: Install CMake
      uses: ssrobins/install-cmake@v1

    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${{ env.LLVM_VERSION }}

    - name: "Get library crispy & vtparser"
      run: python3 scripts/get_contour_dirs.py

    - name: Configure CMake
      run: >
        cmake -B build/static
        -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }}
        -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }}
        -DCMAKE_BUILD_TYPE=Release
        -DENABLE_STATIC_LINKING=ON
        -GNinja
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build build/static --config Release

    - name: Verify static binary
      run: |
        set -e
        echo "--- file output ---"
        file build/static/src/shell/endo
        echo "--- ldd output ---"
        ldd build/static/src/shell/endo 2>&1 && echo "ERROR: binary is dynamically linked" && exit 1 || echo "OK: binary is statically linked"

    - name: Test
      working-directory: build/static
      run: ctest --output-on-failure --build-config Release
      timeout-minutes: 2

    - name: Upload static binary
      uses: actions/upload-artifact@v4
      with:
        name: endo-linux-x86_64-static
        path: build/static/src/shell/endo
        retention-days: 30

  windows-clangcl:
    runs-on: windows-latest
    name: "Windows clang-cl Release"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history + tags so the MSI version is unique per build

    - name: Install CMake
      uses: ssrobins/install-cmake@v1

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: "Get library crispy & vtparser"
      run: python scripts/get_contour_dirs.py

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: '1e199d32ad53aab1defda61ce41c380302e3f95c'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake --preset clangcl-release

    - name: Build
      run: cmake --build build/clangcl-release --config Release

    - name: Test
      working-directory: build/clangcl-release
      run: ctest --output-on-failure --build-config Release
      timeout-minutes: 5

    - name: Build MSI installer
      working-directory: build/clangcl-release
      shell: bash
      run: |
        cpack -G WIX || (cat _CPack_Packages/win64/WIX/wix.log 2>/dev/null; exit 1)

    - name: Upload MSI installer
      uses: actions/upload-artifact@v4
      with:
        name: endo-windows-x86_64-msi
        path: build/clangcl-release/endo-*.msi
        retention-days: 30

  vscode-extension:
    runs-on: ubuntu-latest
    name: "VS Code Extension"
    defaults:
      run:
        working-directory: editors/vscode
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: editors/vscode/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Compile
      run: npm run compile
    - name: Package .vsix
      run: npm run package
    - name: Upload .vsix artifact
      uses: actions/upload-artifact@v4
      with:
        name: endo-vscode-extension
        path: editors/vscode/*.vsix
        retention-days: 30

  linux-deb:
    runs-on: ubuntu-latest
    name: "Linux .deb (Ubuntu 26.04)"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history + tags so the package version is derived correctly

    - name: Build & install-test .deb in Docker
      run: ./scripts/package-deb.sh dist

    - name: Upload .deb / .ddeb artifacts
      uses: actions/upload-artifact@v4
      with:
        name: endo-deb-ubuntu-2604
        path: |
          dist/*.deb
          dist/*.ddeb
        retention-days: 30
