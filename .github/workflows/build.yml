# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    name: "${{ matrix.os }}-${{ matrix.build_type }}"

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest]
        build_type: [RelWithDebInfo]

    steps:
    - uses: actions/checkout@v3

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ matrix.os }}-${{ matrix.c_compiler }}
        max-size: 256M
    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: "Get library crispy & vtparser"
      run: |
        set -ex
        ./scripts/get_contour_dirs.sh

    - name: Install CMake
      uses: ssrobins/install-cmake@v1

    - name: Check cmake version
      run: cmake --version

    - name: Install Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Check Ninja version
      run: ninja --version

    - name: Install clang
      run: |
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 21

    - name: Check clang version
      run: clang++ --version

    - name: Check clang version
      run: clang++-21 --version

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=clang++-21
        -DCMAKE_C_COMPILER=clang-21
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -GNinja
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Check endo formatting
      run: |
        find . -name '*.endo' -not -path './tmp/*' -not -path './build/*' \
          | xargs ${{ steps.strings.outputs.build-output-dir }}/src/shell/endo format --check
      timeout-minutes: 2

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration.
      # Note that --build-config is needed because the default Windows generator is
      # a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --output-on-failure --build-config ${{ matrix.build_type }}
      timeout-minutes: 1

    - name: Check documentation code snippets
      run: |
        python3 \
            scripts/check-doc-snippets.py \
            --endo-path "${{ steps.strings.outputs.build-output-dir }}/src/shell/endo"
      timeout-minutes: 2

  vscode-extension:
    runs-on: ubuntu-latest
    name: "VS Code Extension"
    defaults:
      run:
        working-directory: editors/vscode
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: editors/vscode/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Compile
      run: npm run compile
    - name: Package .vsix
      run: npm run package
    - name: Upload .vsix artifact
      uses: actions/upload-artifact@v4
      with:
        name: endo-vscode-extension
        path: editors/vscode/*.vsix
        retention-days: 30
